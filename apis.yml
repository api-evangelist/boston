    name: OpenBU Repository — OAI-PMH and DSpace REST (Atmire-operated)
    x-operator: tenant
    x-vendor: Atmire
    x-vendor-evidence: >-
      open.bu.edu is a CNAME to boston-prod.cname.atmire.com; the OAI-PMH Identify response returns
