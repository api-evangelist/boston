  - aid: boston:shibboleth-identity-federation
    name: Boston University Shibboleth Identity Provider
    x-operator: institution
    description: >-
      Boston University's SAML 2.0 identity provider, publishing machine-readable entity metadata at
      its own host. The EntityDescriptor carries entityID https://shib.bu.edu/idp/shibboleth, the
      Shibboleth scopes bu.edu and alum.bu.edu, and SingleSignOnService bindings for HTTP-POST,
      HTTP-POST-SimpleSign and HTTP-Redirect. The entity is registered by InCommon and exported to
      eduGAIN, the SWAMID Federation and the UK Access Management Federation, and asserts the REFEDS
      Research & Scholarship, SIRTFI and InCommon Research & Scholarship entity categories. This is
      institution-operated by definition and is the cleanest example in this profile of Boston
      University publishing a machine-readable contract of its own.
    humanURL: https://met.refeds.org/met/entity/https%3A%2F%2Fshib.bu.edu%2Fidp%2Fshibboleth/
    baseURL: https://shib.bu.edu/idp/shibboleth
    tags:
