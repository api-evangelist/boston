apis:
  - aid: boston:wordpress-rest-api
    name: Boston University WordPress REST API
    x-operator: institution
    description: >-
      The WordPress REST API on Boston University's own web platform, and the one substantial
      machine-readable interface the institution both operates and authors. Its discovery document
      advertises 237 routes across 15 namespaces; nine of those namespaces — bu-alert,
      bu-access-control, bu-blocks, bu-cmb2-customizations, bu-navigation, bu-prepress,
      bu-site-manager, bu-slideshow and bu-tts, 31 routes in total — are implemented by WordPress
      plugins Boston University IS&T writes, open-sources at github.com/bu-ist and documents at
      developer.bu.edu. Read routes including /wp/v2/pages, /wp/v2/types, /wp/v2/taxonomies,
      /bu-blocks/v1/search and the per-namespace discovery documents answer anonymous callers;
      privileged routes such as /bu-navigation/v1/parents and /bu-access-control/v1/get-groups
      return HTTP 401 rest_forbidden. Boston University does not present this as a product: there is
      no developer registration, no key, no rate-limit statement and no changelog. The OpenAPI in
      this repository was derived from the live discovery document, not published by BU.
    humanURL: https://developer.bu.edu/
    baseURL: https://www.bu.edu/wp-json
