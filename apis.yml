      atmirevaluepair endpoints.
    description: >-
      OpenBU is Boston University Libraries' open-access institutional repository. The content, the
      collections and the 2144 Handle prefix are Boston University's; the software is DSpace 7.6 and
      the deployment is Atmire's. Both the OAI-PMH 2.0 endpoint and the DSpace 7 REST API answer
      anonymous callers — Identify returns repositoryName OpenBU with an earliest datestamp of
      2005-08-12, ListMetadataFormats offers eight prefixes (oai_dc, qdc, mods, marc, dim, etdms,
      didl, uketd_dc) and ListSets returns 100 sets. Recorded as a tenant relationship: the
      repository is a real institutional surface, the contract describing it belongs to DSpace and
      Atmire, and no DSpace or Figshare specification is saved under this institution's slug.
    humanURL: https://open.bu.edu/
