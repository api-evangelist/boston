description: >-
  Boston University is a private research university in Boston, Massachusetts, chartered in 1869,
  serving roughly 37,000 students across three campuses. Like most universities it is a federation
  of buyers rather than an API producer, and its programmable footprint has to be read that way.
  The one substantial machine-readable interface Boston University both operates AND authors is the
  WordPress REST API on www.bu.edu: nine of its fifteen namespaces are BU IS&T's own plugins —
  bu-alert, bu-blocks, bu-navigation, bu-slideshow, bu-tts and others — open-sourced at
  github.com/bu-ist and documented at developer.bu.edu, with some routes public and some returning
  401. Alongside it, Boston University operates a Shibboleth SAML 2.0 identity provider at
  shib.bu.edu whose entity metadata is public, registered by InCommon and exported to eduGAIN with
  the REFEDS Research & Scholarship and SIRTFI entity categories. Everything else that looks like a
  Boston University API is a vendor's contract running under BU's name: OpenBU is a DSpace 7.6
  instance operated by Atmire (open.bu.edu CNAMEs to boston-prod.cname.atmire.com and its OAI-PMH
  Identify returns the vendor's admin email), the library discovery layer is Ex Libris Primo, and
  the LMS is Blackboard Learn. Those are recorded here as tenant relationships, not as Boston
  University engineering. There is no central developer portal, no API key programme, no published
  API changelog, and the internal WEB APIs portal at webapi.bu.edu is NXDOMAIN.
