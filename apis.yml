    description: >-
      Boston University's learning management system is Blackboard Learn, running on the vendor's
      infrastructure behind a bu.edu hostname. The Learn public REST API responds at
      /learn/api/public/v1/ — the unauthenticated system version endpoint returns Learn 4000.21.0
