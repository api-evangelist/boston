  - aid: boston:ai-api-access
    name: AI API Access (Azure OpenAI / Amazon Bedrock)
    x-operator: tenant
    x-vendor: Microsoft Azure OpenAI / Amazon Bedrock
    description: >-
      Boston University IS&T brokers Large Language Model API keys to affiliated faculty,
      researchers, staff and departments, reselling access to Microsoft Azure OpenAI and Amazon
      Bedrock (including Anthropic models). Access requires financial-administrator approval and an
      AI API Key Request Form, and provisioning details are supplied only after approval. There is
      no public base URL and no public documentation, and the APIs themselves are the cloud
      vendors' — what Boston University operates is the key-issuing process, which is not a
      machine-readable interface. Recorded as a tenant relationship and deliberately not credited
      as institutional engineering.
    humanURL: https://www.bu.edu/tech/services/cccs/collaboration/conversational-ai/ai-api-access/
