  - date: '2026-08-30'
    rating: 3
    pipeline: university
    summary: >-
      Re-profiled under the university pipeline, whose first question is who OPERATES each surface
      rather than whether a specification exists. Two corrections and one real find. CORRECTION ONE:
      OpenBU, previously catalogued as Boston University's own OAI-PMH surface, is an Atmire-operated
      DSpace 7.6 deployment — open.bu.edu is a CNAME to boston-prod.cname.atmire.com, the Identify
      response returns adminEmail atmirenv@gmail.com, and the DSpace REST root advertises
      atmire-versions and atmirevaluepair endpoints. The repository, its content and its 2144 Handle
      prefix are Boston University's; the engineering is not. Re-labelled x-operator tenant, not
      deleted — a tenant relationship is a real institutional fact. CORRECTION TWO: two further
      vendor platforms running under bu.edu hostnames were previously uncatalogued and are now
      recorded as tenant relationships rather than left to be rediscovered and misattributed — Ex
      Libris Primo library discovery (bu.primo.exlibrisgroup.com, vid 01BOSU_INST:BULS) and
      Blackboard Learn (learn.bu.edu CNAMEs to bu.blackboard.com; its public REST API returns Learn
      4000.21.0 unauthenticated and 401 on data routes). THE FIND: Boston University publishes two
      machine-readable interfaces it genuinely operates and authors. The WordPress REST API on
      www.bu.edu advertises 237 routes across 15 namespaces, and nine of those namespaces — 31
      routes — are BU IS&T's own open-source plugins (bu-alert, bu-access-control, bu-blocks,
      bu-cmb2-customizations, bu-navigation, bu-prepress, bu-site-manager, bu-slideshow, bu-tts),
      published at github.com/bu-ist and documented at developer.bu.edu. And shib.bu.edu serves
      public SAML 2.0 Shibboleth IdP metadata, registered by InCommon, exported to eduGAIN, SWAMID
      and the UK Access Management Federation, asserting REFEDS Research & Scholarship and SIRTFI.
      That identity-federation surface had never been catalogued and is the cleanest institution-
      authored contract in this profile. Surfaces hunted and NOT found: course catalog / registrar
      API, open data portal, dining, transit, research-computing API, llms.txt, apis.json,
      /.well-known/security.txt, and any developer portal or API key programme. webapi.bu.edu
      remains NXDOMAIN. bus.bu.edu is a student-built BostonHacks shuttle tracker on a delegated
      bu.edu subdomain served from GitHub Pages, with no API of its own. profiles.bu.edu is a
      Profiles RNS deployment on Boston University's own network, but four candidate API paths all
      returned 404. One OpenAPI was DERIVED from the live WordPress discovery document and marked as
      such; no specification was invented and no vendor specification was saved under this slug.
