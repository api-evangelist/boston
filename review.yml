  - date: '2026-06-03'
    rating: 2
    summary: >-
      Boston University's public, machine-readable API footprint is limited. The one clearly public,
      documented-by-protocol interface verified live is the OpenBU DSpace OAI-PMH endpoint, which
      returned a valid Identify response (repositoryName "OpenBU"). An internal "WEB APIs" portal at
      webapi.bu.edu is referenced but does not resolve publicly (NXDOMAIN / connection refused from
      off-network), so it is treated as gated and no endpoints were invented. AI API access via Azure
      OpenAI / Amazon Bedrock is gated behind a request form. The bu-ist GitHub org exists but hosts
      WordPress tooling, not open API specs. No fabricated endpoints; all entries reflect probed
      status.
    superseded_by: '2026-08-30'
    superseded_note: >-
      This review attributed the OpenBU OAI-PMH endpoint to Boston University. The 2026-08-30 pass
      established that it is Atmire-operated and re-labelled it x-operator tenant. It also missed
      the two surfaces Boston University does operate and author — the WordPress REST API and the
      Shibboleth identity provider — and read the bu-ist GitHub org as "WordPress tooling, not open
      API specs" when those plugins are in fact the implementation behind nine live REST namespaces
      on www.bu.edu.
