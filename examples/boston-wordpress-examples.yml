    x-operator: tenant
    request:
      method: GET
      url: https://open.bu.edu/server/oai/request?verb=Identify
    response:
      status: 200
      content_type: text/xml;charset=UTF-8
      excerpt:
        repositoryName: OpenBU
        protocolVersion: '2.0'
        earliestDatestamp: '2005-08-12T20:32:45Z'
        adminEmail: atmirenv@gmail.com
        granularity: YYYY-MM-DDThh:mm:ssZ
      note: >-
        adminEmail is the vendor's, not Boston University's — this is the evidence that OpenBU is
        an Atmire-operated DSpace deployment.
